name: Ej4 - Artefactos

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Crear archivo
        run: echo "Hola desde el Job 1" > mensaje.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-mensaje
          path: mensaje.txt

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: mi-mensaje

      - name: Mostrar contenido
        run: cat mensaje.txt